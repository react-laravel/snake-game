name: Deploy Snake to B

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validate_only:
        description: Build and check B without uploading or restarting
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10.33.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml
      - name: Build and test client
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Install and test production server
        working-directory: server
        run: |
          pnpm install --prod --frozen-lockfile
          pnpm test
      - name: Package runtime without development files
        run: |
          node scripts/package-runtime.mjs
          du -sh .deploy-runtime
      - name: Publish to server B and retain one version
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only == true }}
          B_DEPLOY_SSH_KEY: ${{ secrets.B_DEPLOY_SSH_KEY }}
          B_DEPLOY_KNOWN_HOSTS: ${{ secrets.B_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-to-b.sh
      - name: Remove temporary upload bundle
        if: always()
        run: rm -rf .deploy-runtime
