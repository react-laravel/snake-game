name: Deploy Snake to B

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-b
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.16.0
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            server/pnpm-lock.yaml
      - name: Build and test client
        working-directory: client
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - name: Install and test production server
        working-directory: server
        run: |
          pnpm install --prod --frozen-lockfile
          pnpm test
      - name: Package runtime without development files
        run: |
          node scripts/package-runtime.mjs
          du -sh .deploy-runtime
      - name: Publish to server B and retain one version
        env:
          B_DEPLOY_SSH_KEY: ${{ secrets.B_DEPLOY_SSH_KEY }}
          B_DEPLOY_KNOWN_HOSTS: ${{ secrets.B_DEPLOY_KNOWN_HOSTS }}
        run: bash scripts/deploy-to-b.sh
      - name: Remove temporary upload bundle
        if: always()
        run: rm -rf .deploy-runtime
